[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hemistat"
version = "0.0.1"
description = "Hemispheric analysis and visualization of NIfTI stat maps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Eric Yates", email = "ey@ericyates.me" }]
keywords = ["neuroimaging", "nifti", "brain", "laterality", "visualization", "fmri"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "nibabel>=3.0",
    "nilearn>=0.10",
    "numpy>=1.21",
    "matplotlib>=3.5",
    "scipy>=1.7",
]

[project.urls]
Homepage = "https://github.com/neurodevs/hemistat"
Repository = "https://github.com/neurodevs/hemistat"
